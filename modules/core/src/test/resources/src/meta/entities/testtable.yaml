testtable:
  type: table
  displayName: testtable
  order: '9'
  primaryKey: ID
  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - name:
        type: VARCHAR(20)
    - valueCol:
        type: VARCHAR(30)
  queries:
  - All records:
      type: 1D_unknown
      roles: '@AllRoles'
      operations:
      - Edit
      - Insert
      - UploadFile
      - UploadBase64File
      - Not for AI
      code: |-
        SELECT
          t.name AS "Name",
          t.value AS "Value"
        FROM
          testtable t
  - Not for AI:
      type: 1D_unknown
      roles: '@AllRoles'
      aiAccessible: false
      operations:
      - Insert
      code: |-
        SELECT
          t.name AS "Name"
        FROM
          testtable t
  operations:
  - Edit:
      records: 1
      roles: Administrator
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Insert:
      roles: Administrator
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - UploadFile:
      roles: Administrator
      code: com.developmentontheedge.be5.modules.core.mcp.TestUploadFileOperation
  - UploadBase64File:
      roles: Administrator
      code: com.developmentontheedge.be5.modules.core.mcp.TestUploadBase64FileOperation
  - Not for AI:
      roles: Administrator
      aiAccessible: false
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
